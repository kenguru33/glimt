# vim:ft=kitty

## name:     Catppuccin Kitty Mocha
## author:   Catppuccin Org
## license:  MIT
## upstream: https://github.com/catppuccin/kitty/blob/main/themes/mocha.conf
## blurb:    Soothing pastel theme for the high-spirited!



# The basic colors
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

# Cursor colors
cursor                  #F5E0DC
cursor_text_color       #1E1E2E

# URL underline color when hovering with mouse
url_color               #F5E0DC

# Kitty window border colors
active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Keep the shell-reported title (working-directory path) out of the macOS title bar.
macos_show_window_title_in none

# Tab bar colors
active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #1E1E2E

# Colors for marks (marked text in the terminal)
mark1_foreground #1E1E2E
mark1_background #B4BEFE
mark2_foreground #1E1E2E
mark2_background #CBA6F7
mark3_foreground #1E1E2E
mark3_background #74C7EC

# The 16 terminal colors

# black
color0 #45475A
color8 #585B70

# red
color1 #F38BA8
color9 #F38BA8

# green
color2  #A6E3A1
color10 #A6E3A1

# yellow
color3  #F9E2AF
color11 #F9E2AF

# blue
color4  #89B4FA
color12 #89B4FA

# magenta
color5  #F5C2E7
color13 #F5C2E7

# cyan
color6  #94E2D5
color14 #94E2D5

# white
color7  #BAC2DE
color15 #A6ADC8

tab_bar_min_tabs            1
#tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
# Tab title: bracketed session name before the dynamic cwd/program title. The
# conditional renders nothing when session_name is empty (non-session windows),
# so no empty "[]" appears. (Bold via fmt.bold is not rendered by kitty's tab
# bar, hence brackets.) Do NOT use {tab.last_focused_progress_percent}: not a
# valid field here, it silently breaks the whole template.
tab_title_template {session_name and '[' + session_name + '] ' or ''}{title}

# Monaco is an Apple system font (no Nerd Font variant exists), so it has no
# icon glyphs. Use it for text and map the Nerd Font icon ranges to the
# icons-only "Symbols Nerd Font Mono" (installed via font-symbols-only-nerd-font).
font_family          Monaco
bold_font             auto
italic_font           auto
bold_italic_font      auto
font_size             13.0

# Nerd Font icon ranges -> Symbols Nerd Font Mono (canonical mapping from the
# Nerd Fonts project). Lets starship/eza/fastfetch icons render over Monaco.
symbol_map U+23FB-U+23FE,U+2B58 Symbols Nerd Font Mono
symbol_map U+E000-U+E00A Symbols Nerd Font Mono
symbol_map U+E0A0-U+E0A2,U+E0B0-U+E0B3 Symbols Nerd Font Mono
symbol_map U+E0A3,U+E0B4-U+E0C8,U+E0CA,U+E0CC-U+E0D4 Symbols Nerd Font Mono
symbol_map U+E200-U+E2A9 Symbols Nerd Font Mono
symbol_map U+E300-U+E3E3 Symbols Nerd Font Mono
symbol_map U+E5FA-U+E6B5 Symbols Nerd Font Mono
symbol_map U+E700-U+E7C5 Symbols Nerd Font Mono
symbol_map U+EA60-U+EBEB Symbols Nerd Font Mono
symbol_map U+F000-U+F2E0 Symbols Nerd Font Mono
symbol_map U+F300-U+F32F Symbols Nerd Font Mono
symbol_map U+F400-U+F532,U+2665,U+26A1 Symbols Nerd Font Mono
symbol_map U+F0001-U+F1AF0 Symbols Nerd Font Mono

macos_titlebar_color #1E1E2E
#confirm_os_window_close 0
window_padding_width 12

# Allow `kitty @` remote control over each window's TTY. Used by greeting.zsh
# to detect whether a window is the first in its tab, so the fastfetch banner
# shows only in that first window (including for manually created splits).
allow_remote_control yes

# Restore the default session on GUI launches (Dock/Spotlight/Finder), which
# don't go through the kitty() shell wrapper. Path is relative to this config
# dir (~/.config/kitty). The shell wrapper still overrides this with --session
# for project-local .kitty.session files.
startup_session default.session

# Window splits (iTerm2-style on macOS)
enabled_layouts splits,stack

# cmd+d           -> vertical split   (new window to the right, side by side)
# cmd+shift+d     -> horizontal split (new window below, stacked)
map cmd+d        launch --location=vsplit --cwd=current
map cmd+shift+d  launch --location=hsplit --cwd=current

# Move focus between split windows
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down

# ctrl+shift+s -> save the current session into the session list at
# ~/.local/share/kitty/sessions/. Routed through an overlay helper (it has a
# TTY to prompt for a name and to reach `kitty @`); the helper excludes its own
# window from the save. See config/kitty-save-session.sh.
map ctrl+shift+s launch --type=overlay --cwd=current sh -c "zsh $HOME/.config/kitty/save-session.sh"

# Session list (matches ctrl+shift+s save above). Open/delete use an fzf picker
# in an overlay; open then loads the chosen session into the running instance.
map ctrl+shift+o         launch --type=overlay sh -c "zsh $HOME/.config/kitty/open-session.sh"
map ctrl+shift+x         close_session .
map ctrl+shift+backspace launch --type=overlay sh -c "zsh $HOME/.config/kitty/delete-session.sh"
